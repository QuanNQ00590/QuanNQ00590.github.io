<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Collector - Puzzle Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 560px;
            padding: 12px;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: #1a1a2e;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .level-info span { font-size: 14px; }
        .level-selector {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .level-selector input {
            width: 60px;
            padding: 5px;
            background: #0f0f18;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            text-align: center;
        }
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .grid-container {
            background: #12121a;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #333;
        }
        .grid {
            display: grid;
            gap: 3px;
        }
        .cell {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-weight: bold;
            font-size: 13px;
        }
        .cell:hover:not(.empty):not(.wall) { transform: scale(1.05); }
        .cell.normal { border: 2px solid rgba(255,255,255,0.3); }
        .cell.normal:hover { box-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .cell.mystery {
            background: linear-gradient(135deg, #555, #777) !important;
            border: 2px solid #888;
            color: #fff !important;
        }
        .cell.dispenser {
            background: #2a2a3a;
            border: 2px solid #555;
        }
        .cell.panel-locked {
            background: repeating-linear-gradient(45deg, #3a3a3a, #3a3a3a 4px, #2a2a2a 4px, #2a2a2a 8px);
            border: 2px solid #555;
        }
        .cell.chain {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            border: 2px solid #D2691E;
        }
        .cell.key {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FF8C00;
            color: #000 !important;
        }
        .cell.connected {
            border: 3px solid #f8f8ff;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.28), 0 0 10px rgba(255,255,255,0.5);
        }
        .cell.gate-cell {
            box-shadow: inset 0 0 0 3px rgba(40,255,120,0.9), 0 0 12px rgba(40,255,120,0.35);
        }
        .cell.key-holder {
            box-shadow: inset 0 0 0 3px rgba(255,210,45,0.9), 0 0 12px rgba(255,210,45,0.45);
        }
        .cell.arrowed-cell {
            box-shadow: inset 0 0 0 3px rgba(255,170,40,0.85), 0 0 12px rgba(255,170,40,0.35);
        }
        .cell.empty {
            background: #111118;
            border: 1px dashed #222;
        }
        .cell.wall {
            background: #1a1a22;
            border: 1px solid #252530;
        }
        .cell.selected {
            transform: scale(1.1) !important;
            box-shadow: 0 0 20px rgba(255,215,0,0.8) !important;
            border-color: #ffd700 !important;
        }
        .cell .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .cell .badge.left {
            left: 2px;
            right: auto;
        }
        .cell .feature-chip {
            position: absolute;
            left: 3px;
            bottom: 2px;
            background: rgba(0,0,0,0.68);
            color: #fff;
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 3px;
            letter-spacing: 0.03em;
        }
        .cell .arrow-icon {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 16px;
            color: #fff;
            text-shadow: 0 1px 3px #000;
        }
        .cell .center-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-shadow: 0 2px 4px #000;
        }
        .cell .queue-preview {
            display: flex;
            gap: 1px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cell .queue-preview .mini-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .customer-area {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #333;
            width: 100%;
            overflow-x: auto;
        }
        .customer-area h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffd700;
            font-size: 14px;
        }
        .customer-columns {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: flex-start;
        }
        .customer-column {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .customer-column h4 {
            color: #666;
            margin-bottom: 3px;
            font-size: 11px;
        }
        .customer {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.3s ease;
            position: relative;
        }
        .conveyor-wrap {
            width: 100%;
            height: 76px;
            position: relative;
            background: #101018;
            border: 2px solid #303044;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 16px rgba(0,0,0,0.4);
        }
        .conveyor-belt {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 22px;
            height: 32px;
            border-radius: 16px;
            background:
                repeating-linear-gradient(90deg, #2c2c38 0 18px, #3a3a48 18px 24px),
                linear-gradient(#252532, #1b1b25);
            border: 1px solid #555568;
            animation: beltMove 0.7s linear infinite;
        }
        .conveyor-belt::before,
        .conveyor-belt::after {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            top: -2px;
            border-radius: 50%;
            background: #15151d;
            border: 3px solid #555568;
        }
        .conveyor-belt::before { left: -8px; }
        .conveyor-belt::after { right: -8px; }
        .conveyor-label {
            position: absolute;
            left: 14px;
            top: 4px;
            font-size: 10px;
            color: #777;
            letter-spacing: 0.08em;
        }
        .conveyor-status {
            position: absolute;
            right: 14px;
            top: 4px;
            font-size: 10px;
            color: #aaa;
        }
        .conveyor-buffer {
            position: absolute;
            left: 52px;
            right: 52px;
            top: 48px;
            height: 18px;
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .buffer-ball {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 1px 5px rgba(0,0,0,0.45);
            animation: bufferRoll 0.8s linear infinite;
        }
        .ball-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }
        .anim-ball {
            position: fixed;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.75);
            box-shadow: 0 2px 8px rgba(0,0,0,0.45);
            transform: translate(-50%, -50%);
            transition: left 0.22s ease-in, top 0.22s ease-in;
        }
        @keyframes beltMove {
            from { background-position: 0 0, 0 0; }
            to { background-position: 24px 0, 0 0; }
        }
        @keyframes bufferRoll {
            from { transform: translateX(-3px) rotate(0deg); }
            to { transform: translateX(3px) rotate(360deg); }
        }
        @media (max-width: 520px) {
            .game-container { padding: 8px; }
            .cell { width: 48px; height: 48px; }
            .grid { gap: 2px; }
            .customer { width: 38px; height: 38px; font-size: 10px; }
            .customer-columns { gap: 6px; }
            .grid-container, .customer-area { padding: 10px; }
        }
        .customer.filled {
            opacity: 0.2;
            transform: scale(0.85);
        }
        .customer.mystery-cust {
            background: linear-gradient(135deg, #555, #777) !important;
            color: #fff !important;
        }
        .customer.linked {
            border: 3px solid #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.45);
            position: relative;
        }
        .customer.linked::after {
            content: '🔗';
            position: absolute;
            right: -5px;
            top: -8px;
            font-size: 11px;
            background: rgba(0,0,0,0.65);
            border-radius: 4px;
            padding: 1px;
        }
        .customer.front-customer {
            outline: 3px solid #ffd700;
            outline-offset: 1px;
        }
        .customer.filled {
            position: relative;
        }
        .customer.filled::after {
            content: '✓';
            position: absolute;
            font-size: 16px;
            color: #8cff9a;
        }
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-secondary { background: #444; color: #fff; }
        .btn-danger { background: #c0392b; color: #fff; }
        .stats {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #12121a);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ffd700;
            max-width: 400px;
        }
        .modal-content h2 { color: #ffd700; margin-bottom: 15px; font-size: 24px; }
        .modal-content p { margin-bottom: 20px; color: #ccc; }
        .feature-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin: 1px;
        }
        .feature-tag.mystery { background: #666; color: #fff; }
        .feature-tag.dispenser { background: #4a4a5a; color: #aaa; }
        .feature-tag.connected { background: #2a5a2a; color: #8f8; }
        .feature-tag.arrow { background: #5a4a2a; color: #fd8; }
        .feature-tag.panel { background: #5a3a2a; color: #fa8; }
        .feature-tag.chain { background: #5a2a2a; color: #f88; }
        .feature-tag.link { background: #2a3a5a; color: #8af; }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎱 Ball Collector</h1>
        </div>
        <div class="level-info">
            <span id="levelNum">Level 1</span>
            <span id="levelDesc">-</span>
            <div class="level-selector">
                <span>L:</span>
                <input type="number" id="levelInput" min="1" max="100" value="1" onchange="goToLevel(this.value)">
                <button class="btn btn-secondary" onclick="prevLevel()">◀</button>
                <button class="btn btn-secondary" onclick="nextLevel()">▶</button>
            </div>
            <span id="scoreDisplay">Score: 0</span>
        </div>
        <div class="game-area">
            <div class="grid-container">
                <div class="grid" id="grid"></div>
            </div>
            <div class="conveyor-wrap" id="conveyor">
                <div class="conveyor-label">CONVEYOR</div>
                <div class="conveyor-status" id="conveyorStatus">0/24</div>
                <div class="conveyor-belt"></div>
                <div class="conveyor-buffer" id="conveyorBuffer"></div>
            </div>
            <div class="customer-area">
                <h3>📦 CUSTOMERS</h3>
                <div class="customer-columns" id="customers"></div>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="undo()">↩️ Undo</button>
            <button class="btn btn-secondary" onclick="useHint()">💡 Hint</button>
            <button class="btn btn-danger" onclick="resetLevel()">🔄 Reset</button>
        </div>
        <div class="stats">
            <span id="movesDisplay">Moves: 0</span> |
            <span id="wrongDisplay">Wrong: 0/3</span> |
            <span id="featuresDisplay"></span>
        </div>
        <div class="stats" style="font-size:11px;line-height:1.8">
            <span class="feature-tag mystery">HIDDEN</span>
            <span class="feature-tag dispenser">TUNNEL</span>
            <span class="feature-tag connected">🔗 CONNECT</span>
            <span class="feature-tag arrow">ARROW</span>
            <span class="feature-tag panel">PANEL</span>
            <span class="feature-tag chain">CHAIN/KEY</span>
            <span class="feature-tag link">LINK CUST</span>
        </div>
    </div>
    <div class="ball-layer" id="ballLayer"></div>
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 Level Complete!</h2>
            <p id="winMsg"></p>
            <div class="level-selector" style="justify-content:center;margin-bottom:12px">
                <span>Level:</span>
                <input type="number" id="winLevelInput" min="1" max="100" value="1">
                <button class="btn btn-secondary" onclick="goToLevelFromWin()">Play</button>
            </div>
            <button class="btn btn-secondary" onclick="resetLevel()">Replay</button>
            <button class="btn btn-primary" onclick="nextLevel()">Next Level →</button>
        </div>
    </div>
    <div class="modal" id="loseModal">
        <div class="modal-content">
            <h2>😔 Game Over</h2>
            <p id="loseMsg">Too many wrong moves!</p>
            <button class="btn btn-primary" onclick="resetLevel()">Try Again</button>
        </div>
    </div>
    <script src="game_levels.js"></script>
    <script>
    // ==================== COLOR MAP ====================
    const COLORS = {
        1:"#ff597b",2:"#fecefe",3:"#cc2c4c",4:"#feac00",5:"#fff800",
        6:"#10d440",7:"#b3ff2c",8:"#14873a",9:"#23ffbf",10:"#68f9ff",
        11:"#15b7ff",12:"#315dff",13:"#b257fe",14:"#cf6544",15:"#e5fffd",16:"#5f5c68"
    };
    const ARROW_DIRS = {up:"↑",down:"↓",left:"←",right:"→"};
    const DIRS = {up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};

    // ==================== GAME STATE ====================
    let currentLevel = 0;
    let grid = [];           // 2D array of cell objects
    let customers = [];      // Array of 4 arrays (columns)
    let moves = 0;
    let wrongMoves = 0;
    let maxWrong = 3;
    let score = 0;
    let history = [];
    let revealedCells = new Set();
    let panelOpen = {};
    let chainUnlocked = false;
    let levelData = null;
    let gates = [];
    let isAnimating = false;
    let conveyorBalls = [];
    const CONVEYOR_CAPACITY = 24;

    // ==================== LEVEL LOADING ====================
    function loadLevel(idx) {
        if (typeof LEVELS_DATA === 'undefined') {
            alert('Level data not loaded! Make sure game_levels.js is included.');
            return;
        }
        if (idx < 0 || idx >= LEVELS_DATA.length) return;
        currentLevel = idx;
        levelData = LEVELS_DATA[idx];
        moves = 0; wrongMoves = 0;
        history = [];
        revealedCells = new Set();
        panelOpen = {};
        chainUnlocked = false;
        gates = levelData.multiplierGates || [];
        conveyorBalls = [];

        // Parse grid from level JSON
        const bb = levelData.ballTrayGrid;
        const cells = bb.cells;
        grid = [];
        for (let r = 0; r < cells.length; r++) {
            grid[r] = [];
            for (let c = 0; c < cells[r].length; c++) {
                grid[r][c] = parseCell(cells[r][c], r, c);
            }
        }

        // Parse customers
        customers = [[], [], [], []];
        const rqs = levelData.receiverQueues || [];
        for (let i = 0; i < rqs.length; i++) {
            const col = rqs[i].column - 1;
            customers[col] = rqs[i].receivers.map((r, row) => ({
                id: `L${idx + 1}-C${col + 1}-R${row + 1}`,
                color: r.color,
                isMystery: r.isMystery || false,
                linkGroup: r.linkGroup || null,
                filled: false
            }));
        }

        // Parse panels
        const panels = levelData.panelHideTrays || [];
        for (const p of panels) {
            for (let r = p.row - 1; r < p.row - 1 + p.height; r++) {
                for (let c = p.column - 1; c < p.column - 1 + p.width; c++) {
                    if (r >= 0 && r < grid.length && c >= 0 && c < grid[0].length) {
                        if (grid[r][c].type !== 'empty') {
                            panelOpen[`${r},${c}`] = false;
                            grid[r][c].panelLocked = true;
                        }
                    }
                }
            }
            grid._panelInfo = grid._panelInfo || [];
            grid._panelInfo.push({...p, remaining: p.number, count: p.number});
        }

        // Parse chain/key
        if (levelData.chain) {
            chainUnlocked = false;
            const ch = levelData.chain;
            for (let i = 0; i < ch.length; i++) {
                let r, c;
                if (ch.orientation === 'horizontal') { r = ch.row - 1; c = ch.column - 1 + i; }
                else { r = ch.row - 1 + i; c = ch.column - 1; }
                if (r >= 0 && r < grid.length && c >= 0 && c < grid[0].length) {
                    grid[r][c].chainLocked = true;
                }
            }
        }
        if (levelData.key) {
            const k = levelData.key;
            const kr = k.row - 1, kc = k.column - 1;
            if (kr >= 0 && kr < grid.length && kc >= 0 && kc < grid[0].length) {
                if (grid[kr][kc].type === 'empty') grid[kr][kc].type = 'key';
                grid[kr][kc].keyCell = true;
            }
        }

        maxWrong = computeMaxWrong(idx + 1);

        // Update UI
        document.getElementById('levelNum').textContent = `Level ${idx + 1}`;
        document.getElementById('levelInput').value = idx + 1;
        const bb2 = levelData.ballTrayGrid;
        const trayCount = countTrays();
        document.getElementById('levelDesc').textContent = `${bb2.rows}x${bb2.columns} | ${trayCount} trays`;
        document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
        document.getElementById('movesDisplay').textContent = `Moves: 0`;
        document.getElementById('wrongDisplay').textContent = `Wrong: 0/${maxWrong}`;
        showFeatures();
        render();
    }

    function parseCell(c, r, col) {
        if (!c) return {type: 'empty'};
        const type = c.type;
        if (type === 'normalTray') {
            return {
                type: 'normal', color: c.color,
                isMystery: c.isMystery || false, isArrowed: c.isArrowed || false,
                arrowDirection: c.arrowDirection || 'up',
                connectionId: c.connectionId || null,
                panelLocked: false, chainLocked: false
            };
        }
        if (type === 'dispenserTray') {
            return {
                type: 'dispenser', queue: (c.queue || []).map(q => q.color),
                outputDirection: c.outputDirection || 'down',
                panelLocked: false, chainLocked: false
            };
        }
        if (type === 'wall') return {type: 'wall'};
        if (type === 'empty') return {type: 'empty'};
        return {type: 'empty'};
    }

    function computeMaxWrong(lv) {
        if (lv <= 20) return 3;
        if (lv <= 40) return 2;
        return 1;
    }

    // ==================== RENDERING ====================
    function render() {
        renderGrid();
        renderCustomers();
        renderConveyorBuffer();
    }

    function renderGrid() {
        const el = document.getElementById('grid');
        const bb = levelData.ballTrayGrid;
        el.style.gridTemplateColumns = `repeat(${bb.columns}, 56px)`;
        el.innerHTML = '';

        for (let r = 0; r < bb.rows; r++) {
            for (let c = 0; c < bb.columns; c++) {
                const cell = grid[r][c];
                const div = document.createElement('div');
                div.className = 'cell';
                div.dataset.row = r;
                div.dataset.col = c;

                if (cell.type === 'normal') {
                    if (cell.panelLocked && panelOpen[`${r},${c}`] === false) {
                        div.classList.add('panel-locked');
                        div.innerHTML = '<span class="center-icon">🔒</span><span class="feature-chip">PANEL</span>';
                    } else if (cell.chainLocked && !chainUnlocked) {
                        div.classList.add('chain');
                        div.innerHTML = '<span class="center-icon">⛓️</span><span class="feature-chip">CHAIN</span>';
                    } else if (cell.isMystery && !revealedCells.has(`${r},${c}`)) {
                        div.classList.add('mystery');
                        div.style.backgroundColor = '#666';
                        div.innerHTML = '?<span class="feature-chip">HIDDEN</span>';
                        div.onclick = () => revealCell(r, c);
                    } else {
                        div.classList.add('normal');
                        div.style.backgroundColor = COLORS[cell.color] || '#888';
                        div.textContent = cell.color;
                        div.style.color = isLight(COLORS[cell.color]) ? '#000' : '#fff';
                        if (cell.connectionId) {
                            div.classList.add('connected');
                            div.innerHTML += '<span class="badge left">🔗</span>';
                        }
                        if (cell.isArrowed) {
                            div.classList.add('arrowed-cell');
                            div.innerHTML += `<span class="arrow-icon">${ARROW_DIRS[cell.arrowDirection] || '↑'}</span>`;
                            div.innerHTML += '<span class="feature-chip">ARROW</span>';
                        }
                        if (cell.keyCell) {
                            div.classList.add('key-holder');
                            div.innerHTML += '<span class="badge">🔑</span><span class="feature-chip">KEY</span>';
                        }
                        const mult = getGateMultiplier(r, c);
                        if (mult > 1) {
                            div.classList.add('gate-cell');
                            div.innerHTML += `<span class="badge">x${mult}</span><span class="feature-chip">GATE</span>`;
                        }
                        div.onclick = () => tapCell(r, c);
                    }
                } else if (cell.type === 'dispenser') {
                    if (cell.panelLocked && panelOpen[`${r},${c}`] === false) {
                        div.classList.add('panel-locked');
                        div.innerHTML = '<span class="center-icon">🔒</span><span class="feature-chip">PANEL</span>';
                    } else if (cell.chainLocked && !chainUnlocked) {
                        div.classList.add('chain');
                        div.innerHTML = '<span class="center-icon">⛓️</span><span class="feature-chip">CHAIN</span>';
                    } else {
                        div.classList.add('dispenser');
                        let qhtml = '<div class="queue-preview">';
                        for (const qc of (cell.queue || []).slice(0, 3)) {
                            qhtml += `<div class="mini-box" style="background:${COLORS[qc]||'#888'}"></div>`;
                        }
                        qhtml += '</div>';
                        div.innerHTML = qhtml + `<span class="badge">${ARROW_DIRS[cell.outputDirection]||'↓'}</span><span class="feature-chip">TUNNEL</span>`;
                        const mult = getGateMultiplier(r, c);
                        if (mult > 1) {
                            div.classList.add('gate-cell');
                            div.innerHTML += `<span class="arrow-icon">x${mult}</span>`;
                        }
                        div.onclick = () => tapDispenser(r, c);
                    }
                } else if (cell.type === 'chain') {
                    div.classList.add('chain');
                    div.innerHTML = '<span class="center-icon">⛓️</span><span class="feature-chip">CHAIN</span>';
                } else if (cell.type === 'key') {
                    div.classList.add('key');
                    div.innerHTML = '<span class="center-icon">🔑</span><span class="feature-chip">KEY</span>';
                    div.onclick = () => tapKey(r, c);
                } else if (cell.type === 'wall') {
                    div.classList.add('wall');
                } else {
                    div.classList.add('empty');
                }
                el.appendChild(div);
            }
        }
    }

    function renderCustomers() {
        const el = document.getElementById('customers');
        const oldPositions = {};
        el.querySelectorAll('.customer[data-customer-id]').forEach(node => {
            oldPositions[node.dataset.customerId] = node.getBoundingClientRect();
        });
        el.innerHTML = '';
        for (let col = 0; col < 4; col++) {
            const colDiv = document.createElement('div');
            colDiv.className = 'customer-column';
            colDiv.innerHTML = `<h4>C${col+1}</h4>`;
            const frontRow = getFrontCustomerIndex(col);
            for (let row = 0; row < customers[col].length; row++) {
                const cust = customers[col][row];
                if (cust.filled) continue;
                const div = document.createElement('div');
                div.className = 'customer';
                div.dataset.customerCol = col;
                div.dataset.customerRow = row;
                div.dataset.customerId = cust.id;
                if (row === frontRow) div.classList.add('front-customer');
                if (cust.isMystery && !revealedCells.has(`cust-${col}-${row}`)) {
                    div.classList.add('mystery-cust');
                    div.innerHTML = '?';
                    div.onclick = () => revealCustomer(col, row);
                } else {
                    div.style.backgroundColor = COLORS[cust.color] || '#888';
                    div.textContent = cust.color;
                    div.style.color = isLight(COLORS[cust.color]) ? '#000' : '#fff';
                }
                if (cust.linkGroup) div.classList.add('linked');
                div.style.animationDelay = `${row * 0.05}s`;
                colDiv.appendChild(div);
            }
            el.appendChild(colDiv);
        }
        requestAnimationFrame(() => {
            el.querySelectorAll('.customer[data-customer-id]').forEach(node => {
                const oldRect = oldPositions[node.dataset.customerId];
                if (!oldRect) return;
                const newRect = node.getBoundingClientRect();
                const dx = oldRect.left - newRect.left;
                const dy = oldRect.top - newRect.top;
                if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
                node.style.transition = 'none';
                node.style.transform = `translate(${dx}px, ${dy}px)`;
                requestAnimationFrame(() => {
                    node.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
                    node.style.transform = '';
                });
            });
        });
    }

    function renderConveyorBuffer() {
        const status = document.getElementById('conveyorStatus');
        const buffer = document.getElementById('conveyorBuffer');
        if (!status || !buffer) return;
        status.textContent = `${conveyorBalls.length}/${CONVEYOR_CAPACITY}`;
        status.style.color = conveyorBalls.length >= CONVEYOR_CAPACITY ? '#ff7777' : '#aaa';
        buffer.innerHTML = '';
        const preview = conveyorBalls.slice(0, 18);
        for (const ball of preview) {
            const dot = document.createElement('div');
            dot.className = 'buffer-ball';
            dot.style.background = COLORS[ball.color] || '#fff';
            buffer.appendChild(dot);
        }
        if (conveyorBalls.length > preview.length) {
            const more = document.createElement('span');
            more.style.fontSize = '10px';
            more.style.color = '#ccc';
            more.textContent = `+${conveyorBalls.length - preview.length}`;
            buffer.appendChild(more);
        }
    }

    // ==================== GAME ACTIONS ====================
    async function tapCell(r, c) {
        if (isAnimating) return;
        const cell = grid[r][c];
        if (cell.type !== 'normal') return;
        if (cell.isArrowed && !isArrowSatisfied(r, c)) {
            shakeCell(r, c); return;
        }
        if (cell.panelLocked && panelOpen[`${r},${c}`] === false) return;
        if (cell.chainLocked && !chainUnlocked) return;

        saveHistory();
        const connected = findConnectedCells(r, c);
        const allCells = [[r, c], ...connected];

        const releases = [];
        for (const [cr, cc] of allCells) {
            const tc = grid[cr][cc];
            if (tc.type === 'normal') {
                releases.push({
                    color: tc.color,
                    count: 9 * getGateMultiplier(cr, cc),
                    source: getCellCenter(cr, cc)
                });
            }
        }

        if (cell.keyCell) unlockChain();
        let animations = [];
        for (const rel of releases) {
            const targets = routeBalls(rel.color, rel.count, rel.source);
            for (const target of targets) animations.push({...target, source: rel.source});
        }
        animations = animations.concat(drainConveyor());

        const cleared = [];
        for (const [cr, cc] of allCells) {
            grid[cr][cc] = {type: 'empty'};
            cleared.push([cr, cc]);
        }
        revealAdjacentMystery(cleared);
        triggerDispensersForCleared(cleared);
        animations = animations.concat(drainConveyor());

        // Check arrow constraints: unsatisfied arrows become unsatisfied
        unlockArrows(r, c);

        moves++;
        updateStats();
        render();
        await animateServedBalls(animations);
        checkWinLose();
    }

    function tapDispenser(r, c) {
        const cell = grid[r][c];
        if (cell.type !== 'dispenser') return;
        shakeCell(r, c);
    }

    function tapKey(r, c) {
        const cell = grid[r][c];
        if (cell.type !== 'key') return;
        saveHistory();
        grid[r][c] = {type: 'empty'};
        unlockChain();
        moves++;
        updateStats();
        render();
    }

    function revealCell(r, c) {
        revealedCells.add(`${r},${c}`);
        // Also reveal adjacent mystery cells
        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nr = r+dr, nc = c+dc;
            if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length) {
                if (grid[nr][nc].type === 'normal' && grid[nr][nc].isMystery) {
                    revealedCells.add(`${nr},${nc}`);
                }
            }
        }
        render();
    }

    function revealCustomer(col, row) {
        revealedCells.add(`cust-${col}-${row}`);
        // Also reveal adjacent mystery customers
        if (row > 0 && customers[col][row-1].isMystery && !customers[col][row-1].filled)
            revealedCells.add(`cust-${col}-${row-1}`);
        if (row < customers[col].length-1 && customers[col][row+1].isMystery && !customers[col][row+1].filled)
            revealedCells.add(`cust-${col}-${row+1}`);
        render();
    }

    // ==================== GAME LOGIC ====================
    function serveBalls(color, count) {
        let remaining = count;
        const servedTargets = [];
        while (remaining >= 3) {
            let served = false;
            for (let col = 0; col < 4 && remaining >= 3; col++) {
                const row = getFrontCustomerIndex(col);
                if (row < 0) continue;
                const cust = customers[col][row];
                if (cust.color !== color) continue;
                if (cust.linkGroup && !isLinkGroupFrontReady(cust.linkGroup)) continue;

                cust.filled = true;
                remaining -= 3;
                score += 10;
                openPanels(1);
                servedTargets.push({color, col, row, targetPoint: getCustomerCenter(col, row)});
                served = true;
            }
            if (!served) break;
        }
        return {servedTargets, remaining};
    }

    function routeBalls(color, count, source) {
        const result = serveBalls(color, count);
        if (result.remaining > 0) addToConveyor(color, result.remaining, source);
        return result.servedTargets;
    }

    function addToConveyor(color, count, source) {
        for (let i = 0; i < count; i++) conveyorBalls.push({color, source});
    }

    function drainConveyor() {
        const animations = [];
        let progressed = true;
        while (progressed) {
            progressed = false;
            for (let i = 0; i < conveyorBalls.length; i++) {
                const color = conveyorBalls[i].color;
                if (!willColorServe(color, 3)) continue;
                const sameColorIndexes = [];
                for (let j = 0; j < conveyorBalls.length && sameColorIndexes.length < 3; j++) {
                    if (conveyorBalls[j].color === color) sameColorIndexes.push(j);
                }
                if (sameColorIndexes.length < 3) continue;
                sameColorIndexes.sort((a, b) => b - a).forEach(idx => conveyorBalls.splice(idx, 1));
                const result = serveBalls(color, 3);
                if (!result.servedTargets.length) {
                    sameColorIndexes.sort((a, b) => a - b).forEach(idx => conveyorBalls.splice(idx, 0, {color}));
                    continue;
                }
                const beltPoint = getConveyorPoint(window.innerWidth / 2);
                for (const target of result.servedTargets) {
                    animations.push({...target, source: beltPoint});
                }
                progressed = true;
                break;
            }
        }
        return animations;
    }

    function willColorServe(color, count) {
        if (count < 3) return false;
        for (let col = 0; col < 4; col++) {
            const row = getFrontCustomerIndex(col);
            if (row < 0) continue;
            const cust = customers[col][row];
            if (cust.color === color && (!cust.linkGroup || isLinkGroupFrontReady(cust.linkGroup))) return true;
        }
        return false;
    }

    function getFrontCustomerIndex(col) {
        for (let row = 0; row < customers[col].length; row++) {
            if (!customers[col][row].filled) return row;
        }
        return -1;
    }

    function isLinkGroupFrontReady(groupId) {
        const members = [];
        for (let col = 0; col < 4; col++) {
            for (let row = 0; row < customers[col].length; row++) {
                const cust = customers[col][row];
                if (cust.linkGroup === groupId && !cust.filled) members.push({col, row});
            }
        }
        if (members.length <= 1) return true;
        return members.every(({col, row}) => getFrontCustomerIndex(col) === row);
    }

    function getGateMultiplier(r, c) {
        let mult = 1;
        for (const gate of gates) {
            const gr = gate.row - 1;
            const gc = gate.column - 1;
            const width = gate.width || 1;
            if (r === gr && c >= gc && c < gc + width) {
                mult = Math.max(mult, gate.multiplier || 1);
            }
        }
        return mult;
    }

    function unlockChain() {
        chainUnlocked = true;
        for (let rr = 0; rr < grid.length; rr++) {
            for (let cc = 0; cc < grid[rr].length; cc++) {
                if (grid[rr][cc].chainLocked) grid[rr][cc].chainLocked = false;
            }
        }
    }

    function revealAdjacentMystery(clearedCells) {
        for (const [r, c] of clearedCells) {
            for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length) {
                    if (grid[nr][nc].type === 'normal' && grid[nr][nc].isMystery) {
                        revealedCells.add(`${nr},${nc}`);
                    }
                }
            }
        }
    }

    function dispenserOutputPosition(r, c) {
        const cell = grid[r][c];
        const [dr, dc] = DIRS[cell.outputDirection] || [1, 0];
        return [r + dr, c + dc];
    }

    function triggerDispensersForCleared(clearedCells) {
        const pending = clearedCells.map(([r, c]) => `${r},${c}`);
        const seen = new Set();
        while (pending.length) {
            const key = pending.shift();
            if (seen.has(key)) continue;
            seen.add(key);
            const [tr, tc] = key.split(',').map(Number);
            if (!grid[tr] || !grid[tr][tc] || grid[tr][tc].type !== 'empty') continue;

            let placed = false;
            for (let r = 0; r < grid.length; r++) {
                if (placed) break;
                for (let c = 0; c < grid[r].length; c++) {
                    const disp = grid[r][c];
                    if (disp.type !== 'dispenser' || !disp.queue || disp.queue.length === 0) continue;
                    if (disp.panelLocked && panelOpen[`${r},${c}`] === false) continue;
                    if (disp.chainLocked && !chainUnlocked) continue;
                    const [or, oc] = dispenserOutputPosition(r, c);
                    if (or !== tr || oc !== tc) continue;

                    const color = disp.queue.shift();
                    grid[tr][tc] = {
                        type: 'normal',
                        color,
                        isMystery: false,
                        isArrowed: false,
                        arrowDirection: 'up',
                        connectionId: null,
                        panelLocked: false,
                        chainLocked: false
                    };
                    if (disp.queue.length === 0) {
                        grid[r][c] = {type: 'empty'};
                        pending.push(`${r},${c}`);
                    }
                    placed = true;
                    break;
                }
            }
        }
    }

    function getCellCenter(r, c) {
        const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        if (!el) return {x: window.innerWidth / 2, y: window.innerHeight / 3};
        const rect = el.getBoundingClientRect();
        return {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2};
    }

    function getCustomerCenter(col, row) {
        const el = document.querySelector(`.customer[data-customer-col="${col}"][data-customer-row="${row}"]`);
        if (!el) return {x: window.innerWidth / 2, y: window.innerHeight * 0.75};
        const rect = el.getBoundingClientRect();
        return {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2};
    }

    function getConveyorPoint(x) {
        const el = document.getElementById('conveyor');
        const rect = el.getBoundingClientRect();
        const clampedX = Math.max(rect.left + 28, Math.min(rect.right - 28, x));
        return {x: clampedX, y: rect.top + rect.height / 2};
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function animateServedBalls(items) {
        if (!items.length) return;
        isAnimating = true;
        const layer = document.getElementById('ballLayer');
        const tasks = [];
        items.forEach((item, idx) => {
            const target = item.targetPoint || getCustomerCenter(item.col, item.row);
            for (let i = 0; i < 3; i++) {
                tasks.push(animateSingleBall({
                    color: item.color,
                    source: {
                        x: item.source.x + (i - 1) * 7,
                        y: item.source.y + (i - 1) * 3
                    },
                    belt: getConveyorPoint(item.source.x + idx * 12),
                    target: {
                        x: target.x + (i - 1) * 6,
                        y: target.y + (i - 1) * 4
                    },
                    delay: idx * 55 + i * 30,
                    layer
                }));
            }
        });
        await Promise.all(tasks);
        isAnimating = false;
    }

    async function animateSingleBall({color, source, belt, target, delay, layer}) {
        await wait(delay);
        const ball = document.createElement('div');
        ball.className = 'anim-ball';
        ball.style.background = COLORS[color] || '#fff';
        ball.style.left = `${source.x}px`;
        ball.style.top = `${source.y}px`;
        layer.appendChild(ball);
        await wait(20);
        ball.style.left = `${belt.x}px`;
        ball.style.top = `${belt.y}px`;
        await wait(240);
        const beltExit = getConveyorPoint(target.x);
        ball.style.transition = 'left 0.24s linear, top 0.24s linear';
        ball.style.left = `${beltExit.x}px`;
        ball.style.top = `${beltExit.y}px`;
        await wait(250);
        ball.style.transition = 'left 0.28s ease-out, top 0.28s ease-out, transform 0.28s ease-out, opacity 0.28s ease-out';
        ball.style.left = `${target.x}px`;
        ball.style.top = `${target.y}px`;
        ball.style.transform = 'translate(-50%, -50%) scale(0.45)';
        ball.style.opacity = '0.25';
        await wait(300);
        ball.remove();
    }

    function isArrowSatisfied(r, c) {
        const cell = grid[r][c];
        if (!cell.isArrowed) return true;
        const [dr, dc] = DIRS[cell.arrowDirection] || [1, 0];
        let nr = r + dr, nc = c + dc;
        // Check all cells in that direction until edge
        while (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length) {
            const tc = grid[nr][nc];
            if (tc.type === 'normal' || tc.type === 'dispenser') return false;
            if (tc.type === 'wall') return false;
            nr += dr; nc += dc;
        }
        return true;
    }

    function unlockArrows(r, c) {
        // After clearing a cell, check if any arrows become satisfied
        // (simplified: re-render will handle visual)
    }

    function openPanels(count = 1) {
        if (!grid._panelInfo) return;
        for (const p of grid._panelInfo) {
            if (p.remaining <= 0) continue;
            p.remaining -= count;
            if (p.remaining <= 0) {
                for (let r = p.row - 1; r < p.row - 1 + p.height; r++) {
                    for (let c = p.column - 1; c < p.column - 1 + p.width; c++) {
                        if (r >= 0 && r < grid.length && c >= 0 && c < grid[0].length) {
                            panelOpen[`${r},${c}`] = true;
                            grid[r][c].panelLocked = false;
                        }
                    }
                }
            }
        }
    }

    function findConnectedCells(r, c) {
        const cell = grid[r][c];
        if (!cell.connectionId) return [];
        const result = [];
        for (let rr = 0; rr < grid.length; rr++) {
            for (let cc = 0; cc < grid[rr].length; cc++) {
                if (rr === r && cc === c) continue;
                if (grid[rr][cc].connectionId === cell.connectionId) {
                    result.push([rr, cc]);
                }
            }
        }
        return result;
    }

    function countTrays() {
        let count = 0;
        for (const row of grid) for (const c of row) {
            if (c.type === 'normal' || c.type === 'dispenser') count++;
        }
        return count;
    }

    // ==================== HISTORY ====================
    function saveHistory() {
        history.push({
            grid: JSON.parse(JSON.stringify(grid)),
            customers: JSON.parse(JSON.stringify(customers)),
            revealed: new Set(revealedCells),
            panelOpen: {...panelOpen},
            chainUnlocked,
            conveyorBalls: JSON.parse(JSON.stringify(conveyorBalls)),
            moves,
            wrongMoves,
            score
        });
        if (history.length > 50) history.shift();
    }

    function undo() {
        if (history.length === 0) return;
        const state = history.pop();
        grid = state.grid;
        customers = state.customers;
        revealedCells = state.revealed;
        panelOpen = state.panelOpen;
        chainUnlocked = state.chainUnlocked;
        conveyorBalls = state.conveyorBalls || [];
        moves = state.moves;
        wrongMoves = state.wrongMoves;
        score = state.score;
        updateStats();
        render();
    }

    function resetLevel() {
        document.getElementById('winModal').classList.remove('active');
        document.getElementById('loseModal').classList.remove('active');
        loadLevel(currentLevel);
    }

    function useHint() {
        // Reveal a mystery cell
        for (let r = 0; r < grid.length; r++) {
            for (let c = 0; c < grid[r].length; c++) {
                if (grid[r][c].type === 'normal' && grid[r][c].isMystery && !revealedCells.has(`${r},${c}`)) {
                    revealCell(r, c);
                    return;
                }
            }
        }
        // Reveal mystery customer
        for (let col = 0; col < 4; col++) {
            for (let row = 0; row < customers[col].length; row++) {
                if (customers[col][row].isMystery && !customers[col][row].filled && !revealedCells.has(`cust-${col}-${row}`)) {
                    revealCustomer(col, row);
                    return;
                }
            }
        }
    }

    // ==================== WIN/LOSE CHECK ====================
    function checkWinLose() {
        if (conveyorBalls.length >= CONVEYOR_CAPACITY) {
            setTimeout(() => {
                document.getElementById('loseMsg').textContent = `Conveyor full: ${conveyorBalls.length}/${CONVEYOR_CAPACITY}`;
                document.getElementById('loseModal').classList.add('active');
            }, 300);
            return;
        }
        let allFilled = true;
        for (const col of customers) {
            for (const cust of col) {
                if (!cust.filled) { allFilled = false; break; }
            }
            if (!allFilled) break;
        }
        if (allFilled && conveyorBalls.length === 0) {
            score += Math.max(0, 100 - moves * 5);
            setTimeout(() => {
                document.getElementById('winMsg').textContent = `Moves: ${moves} | Score: ${score}`;
                document.getElementById('winLevelInput').value = Math.min(currentLevel + 2, LEVELS_DATA.length);
                document.getElementById('winModal').classList.add('active');
            }, 400);
            return;
        }
        if (wrongMoves >= maxWrong) {
            setTimeout(() => {
                document.getElementById('loseMsg').textContent = `Wrong moves: ${wrongMoves}/${maxWrong}`;
                document.getElementById('loseModal').classList.add('active');
            }, 400);
        }
    }

    // ==================== NAVIGATION ====================
    function nextLevel() {
        document.getElementById('winModal').classList.remove('active');
        document.getElementById('loseModal').classList.remove('active');
        if (currentLevel < LEVELS_DATA.length - 1) loadLevel(currentLevel + 1);
    }
    function prevLevel() {
        document.getElementById('winModal').classList.remove('active');
        document.getElementById('loseModal').classList.remove('active');
        if (currentLevel > 0) loadLevel(currentLevel - 1);
    }
    function goToLevel(v) {
        const n = parseInt(v) - 1;
        if (n >= 0 && n < LEVELS_DATA.length) loadLevel(n);
    }
    function goToLevelFromWin() {
        document.getElementById('winModal').classList.remove('active');
        const n = parseInt(document.getElementById('winLevelInput').value) - 1;
        if (n >= 0 && n < LEVELS_DATA.length) loadLevel(n);
    }

    // ==================== UI HELPERS ====================
    function updateStats() {
        document.getElementById('movesDisplay').textContent = `Moves: ${moves}`;
        document.getElementById('wrongDisplay').textContent = `Wrong: ${wrongMoves}/${maxWrong}`;
        document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
    }

    function showFeatures() {
        const el = document.getElementById('featuresDisplay');
        const tags = [];
        const bb = levelData.ballTrayGrid;
        let hasM = false, hasD = false, hasA = false, hasP = false, hasC = false, hasL = false;
        for (const row of bb.cells) for (const c of row) {
            if (c.type === 'normalTray') {
                if (c.isMystery) hasM = true;
                if (c.isArrowed) hasA = true;
                if (c.connectionId) hasC = true;
            }
            if (c.type === 'dispenserTray') hasD = true;
        }
        if ((levelData.panelHideTrays||[]).length) hasP = true;
        for (const rq of (levelData.receiverQueues||[])) {
            for (const r of rq.receivers) { if (r.linkGroup) hasL = true; }
        }
        if (hasM) tags.push('<span class="feature-tag mystery">Mystery</span>');
        if (hasD) tags.push('<span class="feature-tag dispenser">Tunnel</span>');
        if (hasA) tags.push('<span class="feature-tag arrow">Arrow</span>');
        if (hasP) tags.push('<span class="feature-tag panel">Panel</span>');
        if (hasC) tags.push('<span class="feature-tag connected">Connected</span>');
        if (hasL) tags.push('<span class="feature-tag link">Link</span>');
        el.innerHTML = tags.join(' ');
    }

    function isLight(hex) {
        if (!hex) return false;
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        return (r*299+g*587+b*114)/1000 > 150;
    }

    function shakeCell(r, c) {
        const idx = r * levelData.ballTrayGrid.columns + c;
        const cells = document.querySelectorAll('.cell');
        if (cells[idx]) {
            cells[idx].style.animation = 'shake 0.3s';
            setTimeout(() => cells[idx].style.animation = '', 300);
        }
    }

    // ==================== START ====================
    loadLevel(0);
    </script>
</body>
</html>
