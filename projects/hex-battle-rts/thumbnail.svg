<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hex Battle RTS prototype thumbnail</title>
  <desc id="desc">Real-time strategy tower defense game with hexagonal grid-based battles, 5 unit types, lab technology, and dynamic gameplay.</desc>

  <!-- Background -->
  <rect width="960" height="540" fill="#0a0e27"/>

  <!-- Main card -->
  <rect x="58" y="48" width="844" height="444" rx="24" fill="#1a1c23" stroke="#4ade80" stroke-width="4"/>

  <!-- Title -->
  <text x="92" y="105" fill="#4ade80" font-family="Arial, sans-serif" font-size="52" font-weight="800">HEX BATTLE RTS</text>

  <!-- Unit grid (left side) -->
  <g fill="#2d3748" stroke="#4ade80" stroke-width="2">
    <!-- Top row -->
    <rect x="112" y="140" width="70" height="70" rx="8"/>
    <rect x="194" y="140" width="70" height="70" rx="8"/>
    <rect x="276" y="140" width="70" height="70" rx="8"/>
    <rect x="358" y="140" width="70" height="70" rx="8"/>

    <!-- Bottom row -->
    <rect x="112" y="230" width="70" height="70" rx="8"/>
    <rect x="194" y="230" width="70" height="70" rx="8"/>
    <rect x="276" y="230" width="70" height="70" rx="8"/>
    <rect x="358" y="230" width="70" height="70" rx="8"/>
  </g>

  <!-- Unit icons -->
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle" font-size="32">
    <text x="147" y="185" fill="#22c55e">⚔️</text>
    <text x="229" y="185" fill="#0ea5e9">🏹</text>
    <text x="311" y="185" fill="#8b5cf6">🔮</text>
    <text x="393" y="185" fill="#ec4899">❤️</text>

    <text x="147" y="275" fill="#eab308">🛡️</text>
    <text x="229" y="275" fill="#22c55e">⚔️</text>
    <text x="311" y="275" fill="#0ea5e9">🏹</text>
    <text x="393" y="275" fill="#8b5cf6">🔮</text>
  </g>

  <!-- Upgrade panels (right side) -->
  <g>
    <rect x="520" y="140" width="72" height="80" rx="10" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="608" y="140" width="72" height="80" rx="10" fill="#1f2937" stroke="#a855f7" stroke-width="3"/>
    <rect x="696" y="140" width="72" height="80" rx="10" fill="#1f2937" stroke="#4ade80" stroke-width="3"/>

    <rect x="520" y="240" width="248" height="60" rx="10" fill="#1f2937" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Upgrade labels -->
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle" font-size="18" fill="#fff">
    <text x="556" y="190">PWR</text>
    <text x="644" y="190">HP</text>
    <text x="732" y="190">SPD</text>

    <text x="644" y="275" font-size="16" fill="#fbbf24">LAB TECH</text>
  </g>

  <!-- Description -->
  <text x="92" y="470" fill="#888" font-family="Arial, sans-serif" font-size="26">Real-time strategy tower defense</text>
</svg>
